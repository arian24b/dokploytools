name: release
# Tag to release: git tag v1.2.3 && git push --tags
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o dist/dokploytools-$os-$arch$ext ./src
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: build wheels
        run: python3 scripts/build_wheels.py "${GITHUB_REF_NAME#v}" dist wheels
      - name: smoke-test wheel
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install --no-index --no-deps wheels/*manylinux_2_17_x86_64*.whl
          /tmp/v/bin/dpt version | grep -F "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          password: ${{ secrets.PYPI_API_TOKEN }}
